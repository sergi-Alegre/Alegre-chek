<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d2b">
<title>Alegre Check · Oficina</title>
<style>
:root{--petrol:#071d2b;--petrol2:#0b2d40;--panel:#0e3448;--panel2:#123e52;--pink:#ef4f87;--pink2:#ff78a8;--cyan:#30c7e8;--green:#39dc8b;--gold:#ffc857;--white:#f7fbff;--muted:#9eb8c7;--danger:#ff617c;--line:rgba(100,197,226,.18)}
*{box-sizing:border-box}html{min-height:100%;background:var(--petrol)}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--white);background:radial-gradient(circle at 50% -10%,#0e5570 0,#092d40 30%,#071d2b 65%,#04131d 100%);background-attachment:fixed}.wrap{max-width:1220px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}.shell{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(17,60,81,.94),rgba(5,27,40,.97));box-shadow:0 18px 52px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.05);border-radius:28px;padding:20px;margin-bottom:16px}.shell:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(239,79,135,.13);filter:blur(20px);right:-90px;top:-150px}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1}.brand{display:flex;align-items:center;gap:15px;min-width:0}.brandmark{width:112px;height:72px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.brandmark img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.28))}.brandcopy h1{margin:0;font-size:26px;letter-spacing:-.6px}.brandcopy h1 span{color:var(--pink2)}.brandcopy p{margin:5px 0 0;color:#d4e7ef;font-size:13px}.section-kicker{font-size:10px;color:var(--cyan);font-weight:900;letter-spacing:1.15px;text-transform:uppercase;margin-bottom:5px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.top h1,.top h2{margin:0}.card{background:linear-gradient(145deg,rgba(15,52,72,.96),rgba(8,36,52,.98));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.17),inset 0 1px rgba(255,255,255,.035)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:18px;position:relative;z-index:1}.stat{position:relative;overflow:hidden;background:rgba(3,22,32,.52);border:1px solid rgba(255,255,255,.075);padding:15px 16px;border-radius:17px;min-height:105px}.stat:before{content:"";position:absolute;inset:auto -35px -55px auto;width:100px;height:100px;border-radius:50%;background:rgba(48,199,232,.08)}.stat.pink:before{background:rgba(239,79,135,.12)}.stat.gold:before{background:rgba(255,200,87,.11)}.stat span{font-size:12px;color:#b9d0dc;font-weight:700}.stat b{font-size:31px;display:block;margin-top:9px;line-height:1;color:#fff}.stat small{display:block;margin-top:6px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.btn{appearance:none;border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;transition:transform .12s ease,filter .15s ease,box-shadow .15s ease;text-decoration:none;text-align:center;font-size:14px}.btn:active{transform:scale(.98)}.dark{background:linear-gradient(135deg,var(--pink),#d93773);color:#fff;box-shadow:0 8px 20px rgba(239,79,135,.24)}.light{background:#163f53;color:#e6f2f7;border:1px solid rgba(255,255,255,.07)}.green{background:rgba(57,220,139,.16);color:#72f0b2;border:1px solid rgba(57,220,139,.34)}.amber{background:rgba(255,200,87,.14);color:#ffd776;border:1px solid rgba(255,200,87,.34)}.red{background:rgba(255,97,124,.14);color:#ff8da0;border:1px solid rgba(255,97,124,.32)}.tabs .btn{min-height:48px;background:rgba(5,28,41,.62);color:#a9c4d1;border:1px solid rgba(255,255,255,.06)}.tabs .dark{background:linear-gradient(135deg,#164d68,#0c3449);color:#fff;border-color:rgba(48,199,232,.38);box-shadow:0 0 0 2px rgba(48,199,232,.11),0 8px 22px rgba(0,0,0,.2)}.list{display:grid;gap:9px}.row{display:grid;grid-template-columns:125px 1fr auto;gap:15px;align-items:center;background:linear-gradient(145deg,rgba(14,52,71,.9),rgba(7,31,45,.95));border:1px solid var(--line);border-radius:16px;padding:14px 15px;cursor:pointer;transition:transform .13s ease,border-color .15s ease,background .15s ease}.row:hover{transform:translateY(-1px);border-color:rgba(48,199,232,.42);background:linear-gradient(145deg,rgba(17,62,83,.96),rgba(8,35,49,.98))}.plate{font-size:20px;font-weight:950;letter-spacing:.3px;color:#fff}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;border:1px solid transparent;white-space:nowrap}.review{background:rgba(255,200,87,.12);color:#ffd879;border-color:rgba(255,200,87,.28)}.auto{background:rgba(57,220,139,.13);color:#68efaa;border-color:rgba(57,220,139,.28)}.reviewed{background:rgba(48,199,232,.12);color:#6edcf1;border-color:rgba(48,199,232,.27)}.pending{background:rgba(166,190,203,.1);color:#b7ccd6;border-color:rgba(166,190,203,.16)}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photo{background:#071f2d;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.photo img{width:100%;height:210px;object-fit:cover;display:block;background:#03111a}.photo div{padding:9px 10px;font-size:12px;font-weight:800;color:#dcecf3}.score-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.score{padding:16px;font-size:17px;min-height:58px}.login{max-width:440px;margin:7vh auto 0}.login .brandlogin{text-align:center;margin-bottom:22px}.login .brandmark{width:180px;height:145px;margin:0 auto 12px}.login h1{margin:0;font-size:28px}.login h2{margin:5px 0;color:var(--pink2);font-size:19px}.login p{margin:5px 0}.login input,textarea,select,input[type=file]{width:100%;padding:13px 14px;border:1px solid #28556a;border-radius:12px;font-size:16px;background:#07283a;color:#fff;outline:none}.login input:focus,textarea:focus,select:focus,input[type=file]:focus{border-color:var(--pink2);box-shadow:0 0 0 3px rgba(239,79,135,.13)}label{display:block;font-size:13px;font-weight:850;margin:14px 0 6px;color:#dceaf1}textarea{min-height:100px;resize:vertical}select option{background:#08283a}.rank-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.rank{width:100%;border-collapse:collapse;min-width:760px}.rank th,.rank td{text-align:left;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.06)}.rank th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#82b8cb;background:rgba(3,22,32,.52)}.rank tr:last-child td{border-bottom:0}.rank tbody tr:hover{background:rgba(48,199,232,.045)}.rank td:nth-child(1){font-weight:950;color:var(--gold)}.rank td:nth-child(3){font-size:17px;font-weight:950;color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar b{margin-right:auto}.toolbar input{padding:11px 12px;border:1px solid #28556a;border-radius:11px;background:#07283a;color:#fff;min-width:260px;outline:none}.toolbar input:focus{border-color:var(--cyan)}.empty{text-align:center;color:var(--muted);padding:34px}.damage-section-title{display:flex;align-items:center;gap:8px;margin:17px 2px 10px}.damage-section-title h3{margin:0}.count-pill{font-size:11px;font-weight:900;border-radius:999px;background:rgba(48,199,232,.11);border:1px solid rgba(48,199,232,.24);color:#6dddf3;padding:5px 8px}.damage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.damage-card{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:linear-gradient(145deg,rgba(14,52,71,.93),rgba(7,31,45,.98));box-shadow:0 10px 25px rgba(0,0,0,.14)}.damage-card img{width:100%;height:220px;object-fit:cover;display:block;background:#03111a}.damage-card .pad{padding:14px}.damage-card p{color:#dbe9ef;line-height:1.4}.activeDamage{border-color:rgba(255,200,87,.45);box-shadow:0 0 0 1px rgba(255,200,87,.08),0 12px 28px rgba(0,0,0,.17)}.repaired{opacity:.72;filter:saturate(.75)}pre{background:#061f2d;border:1px solid var(--line);padding:14px;border-radius:13px;color:#cae0e9;overflow:auto;white-space:pre-wrap}.case-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.case-meta{margin-top:4px;color:var(--muted);font-size:13px}.subhead{margin:22px 0 10px;font-size:16px}.history-note{display:flex;align-items:center;gap:8px;background:rgba(48,199,232,.07);border:1px solid rgba(48,199,232,.16);padding:10px 12px;border-radius:12px;color:#bdd6e0;font-size:13px}.office-link{white-space:nowrap}.login-error{background:rgba(255,97,124,.1);border:1px solid rgba(255,97,124,.28);color:#ff9aae;padding:10px 12px;border-radius:11px;margin:12px 0}.form-card{max-width:680px}.form-card .dark{min-height:50px}
@media(max-width:900px){.damage-grid{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.wrap{padding:10px}.shell{border-radius:20px;padding:14px}.brandrow{align-items:flex-start}.brandmark{width:82px;height:66px}.brandcopy h1{font-size:22px}.brandcopy p{font-size:11px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.tabs{grid-template-columns:1fr 1fr}.row{grid-template-columns:92px 1fr;gap:10px;padding:13px}.row>div:last-child{grid-column:1/-1}.photos,.score-buttons,.damage-grid{grid-template-columns:1fr}.photo img,.damage-card img{height:240px}.top{align-items:flex-start;flex-direction:column}.top .btn{width:100%}.toolbar{align-items:stretch}.toolbar b{width:100%}.toolbar input{width:100%;min-width:0}.toolbar .muted{width:100%}.case-head{align-items:flex-start;flex-direction:column}.case-head .badge{align-self:flex-start}.office-link{padding:9px 10px}.login{margin-top:3vh}.login .brandmark{width:150px;height:121px}.card{padding:15px;border-radius:17px}}
@media(max-width:420px){.brandcopy p{display:none}.stats{grid-template-columns:1fr}.stat:last-child{grid-column:auto}.tabs{grid-template-columns:1fr}.photo img,.damage-card img{height:215px}}
</style>
</head>
<body><main class="wrap"><div id="app"></div></main><script>
const PLATES=['KCV','49 NGM','25 NGM','KVF','MFB','MJB','MPT','90 NGM','KZZ','LBG','LBZ','LYR','LZD','KYS','MVJ','MVG','MTY','KXW','MGC'];const LABELS={front:'Frontal',rear:'Trasera',left:'Lateral izquierdo',right:'Lateral derecho',cabFront:'Interior delantero',cabRear:'Interior trasero',matsFront:'Alfombras delanteras',matsRear:'Alfombras traseras',dashboard:'Cuadro / combustible',interior:'Limpieza interior',exterior:'Limpieza exterior',mechanics:'Mecánica',bodywork:'Plancha'};let DATA=null,DAMAGES=[],tab='reviews',search='';const app=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}function dt(x){return new Date(x).toLocaleString('es-ES',{timeZone:'Europe/Madrid',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function status(r){if(r.score_status==='review')return'<span class="badge review">⚠ Revisión oficina</span>';if(r.score_status==='auto')return'<span class="badge auto">✓ 10 automático</span>';if(r.score_status==='reviewed')return`<span class="badge reviewed">✓ Resuelto · ${r.score} puntos</span>`;return'<span class="badge pending">Pendiente de recogida</span>'}
async function boot(){const q=await fetch('/api/office-login');const a=await q.json();if(!a.configured)return app.innerHTML='<div class="card login"><div class="brandlogin"><div class="brandmark"><img src="/logo-alegre.svg" alt="Automòbils Alegre · 80 Years"></div><h1>ALEGRE CHECK</h1><h2>OFICINA</h2></div><p>Falta configurar el PIN privado de oficina en Vercel.</p></div>';if(!a.authorized)return login();await load()}function login(msg=''){app.innerHTML=`<div class="card login"><div class="brandlogin"><div class="brandmark"><img src="/logo-alegre.svg" alt="Automòbils Alegre · 80 Years"></div><div class="section-kicker">Acceso privado</div><h1>ALEGRE <span style="color:var(--pink2)">CHECK</span></h1><h2>Panel de Oficina</h2><p class="muted">Gestión de revisiones, ranking y daños</p></div>${msg?`<div class="login-error">${esc(msg)}</div>`:''}<input id="pin" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" enterkeyhint="go" placeholder="Contraseña de oficina" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn dark" style="width:100%;margin-top:10px" onclick="doLogin()">Entrar al panel</button></div>`}async function doLogin(){const r=await fetch('/api/office-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});if(!r.ok)return login('Contraseña incorrecta');await load()}
async function load(){const [r,d]=await Promise.all([fetch('/api/office-data'),fetch('/api/vehicle-damages')]);if(r.status===401||d.status===401)return login();DATA=await r.json();DAMAGES=(await d.json()).damages||[];render()}
function render(){const pending=DATA.reviews.length,evaluated=DATA.ranking.reduce((a,x)=>a+(x.evaluated_dropoffs||0),0),leader=DATA.ranking.find(x=>x.average!=null);app.innerHTML=`<section class="shell"><div class="brandrow"><div class="brand"><div class="brandmark"><img src="/logo-alegre.svg" alt="Automòbils Alegre · 80 Years"></div><div class="brandcopy"><div class="section-kicker">Panel privado</div><h1>ALEGRE <span>CHECK</span> · OFICINA</h1><p>Control de calidad, evidencias y estado de flota · ${esc(DATA.month)}</p></div></div><a class="btn light office-link" href="/">↗ Formulario</a></div><div class="stats"><div class="stat pink"><span>⚠ Revisiones pendientes</span><b>${pending}</b><small>${pending===1?'caso requiere decisión':'casos requieren decisión'}</small></div><div class="stat"><span>✓ Dejadas evaluadas</span><b>${evaluated}</b><small>durante el mes actual</small></div><div class="stat gold"><span>🏆 Líder del mes</span><b style="font-size:21px">${leader?esc(leader.driver):'—'}</b><small>${leader?.average??'—'} / 10 de media</small></div></div></section><div class="tabs"><button class="btn ${tab==='reviews'?'dark':'light'}" onclick="tab='reviews';render()">⚠ Revisiones (${pending})</button><button class="btn ${tab==='dropoffs'?'dark':'light'}" onclick="tab='dropoffs';render()">📷 Dejadas</button><button class="btn ${tab==='damages'?'dark':'light'}" onclick="tab='damages';render()">🚘 Daños</button><button class="btn ${tab==='ranking'?'dark':'light'}" onclick="tab='ranking';render()">🏆 Ranking</button></div><div id="content"></div>`;if(tab==='reviews')reviews();if(tab==='dropoffs')dropoffs();if(tab==='damages')damages();if(tab==='ranking')ranking()}
function row(r){return `<div class="row" onclick="openCase('${r.id}')"><div class="plate">${esc(r.plate)}</div><div><b>${esc(r.driver)}</b><div class="muted">Dejada · ${dt(r.created_at)}</div>${r.pickup_driver?`<div style="margin-top:4px">→ Recoge <b>${esc(r.pickup_driver)}</b> · ${dt(r.pickup_created_at)}</div>`:'<div class="muted" style="margin-top:4px">Aún sin recogida posterior</div>'}</div><div>${status(r)}</div></div>`}function reviews(){const el=document.getElementById('content');el.innerHTML=DATA.reviews.length?'<div class="list">'+DATA.reviews.map(row).join('')+'</div>':'<div class="card empty"><div style="font-size:36px;margin-bottom:8px">✓</div><b>No hay revisiones pendientes</b><div class="muted" style="margin-top:5px">Todo está al día.</div></div>'}function dropoffs(){const el=document.getElementById('content'),q=search.trim().toLowerCase(),rows=DATA.dropoffs.filter(r=>!q||r.plate.toLowerCase().includes(q)||r.driver.toLowerCase().includes(q));el.innerHTML=`<div class="card toolbar"><b>Histórico completo de dejadas</b><input placeholder="Buscar matrícula o conductor" value="${esc(search)}" oninput="search=this.value;dropoffs()"><span class="muted">${rows.length} registros</span></div><div class="list">${rows.map(row).join('')||'<div class="card empty">Sin resultados.</div>'}</div>`}
function photos(title,arr){return `<h3 class="subhead">${esc(title)}</h3>${arr.length?`<div class="photos">${arr.map(p=>`<div class="photo"><img loading="lazy" src="${p.src}"><div>${esc(LABELS[p.label]||p.label)}</div></div>`).join('')}</div>`:'<p class="muted">Sin fotografías.</p>'}`}function reasonText(r){return Array.isArray(r.pickup_reasons)&&r.pickup_reasons.length?r.pickup_reasons.join(', '):(r.pickup_apt===true?'Apto para trabajar':'—')}
function openCase(id){const r=DATA.dropoffs.find(x=>x.id===id)||DATA.reviews.find(x=>x.id===id);if(!r)return;document.getElementById('content').innerHTML=`<button class="btn light" onclick="render()">← Volver al panel</button><div class="card" style="margin-top:12px"><div class="case-head"><div><div class="section-kicker">Detalle de dejada</div><div class="plate" style="font-size:27px">${esc(r.plate)}</div><div class="case-meta"><b style="color:#fff">${esc(r.driver)}</b> · ${dt(r.created_at)}</div></div>${status(r)}</div>${photos('9 fotos de la dejada',r.dropoffPhotos)}<h3 class="subhead">Checklist declarado</h3><pre>${esc(JSON.stringify(r.checklist,null,2))}</pre></div>${r.pickup_id?`<div class="card"><div class="section-kicker">Comparación posterior</div><h2>Siguiente recogida</h2><p><b>${esc(r.pickup_driver)}</b> · ${dt(r.pickup_created_at)}</p><p><b>Resultado:</b> ${esc(reasonText(r))}</p>${photos('Fotos de incidencias en la recogida',r.pickupPhotos)}</div>`:''}${r.score_status==='review'?`<div class="card"><div class="section-kicker">Decisión pendiente</div><h2>Decisión de oficina</h2><p class="muted">Compara las evidencias y asigna los puntos al conductor que dejó el vehículo.</p><textarea id="reviewNotes" placeholder="Comentario opcional"></textarea><div class="score-buttons"><button class="btn green score" onclick="resolveReview('${r.id}',10)">10 · Correcto</button><button class="btn amber score" onclick="resolveReview('${r.id}',5)">5 · Mejorable</button><button class="btn red score" onclick="resolveReview('${r.id}',0)">0 · Incorrecto</button></div></div>`:''}`}
async function resolveReview(id,score){if(!confirm(`Asignar ${score} puntos a esta dejada?`))return;const r=await fetch('/api/office-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dropoffId:id,score,notes:document.getElementById('reviewNotes')?.value||'',reviewer:'Oficina'})});if(!r.ok)return alert('No se pudo guardar la revisión');await load()}
function ranking(){const el=document.getElementById('content');el.innerHTML=`<div class="card"><div class="section-kicker">Rendimiento mensual</div><h2>🏆 Ranking de conductores</h2><p class="muted">Media basada en dejadas evaluadas durante el mes.</p><div class="rank-wrap"><table class="rank"><thead><tr><th>#</th><th>Conductor</th><th>Media</th><th>Evaluadas</th><th>10</th><th>5</th><th>0</th><th>Pendientes</th></tr></thead><tbody>${DATA.ranking.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.driver)}</b></td><td>${r.average??'—'}</td><td>${r.evaluated_dropoffs}</td><td>${r.tens}</td><td>${r.fives}</td><td>${r.zeros}</td><td>${r.pending_reviews}</td></tr>`).join('')}</tbody></table></div></div>`}
function damages(){const active=DAMAGES.filter(d=>d.status==='active'),repaired=DAMAGES.filter(d=>d.status==='repaired');document.getElementById('content').innerHTML=`<div class="card"><div class="top"><div><div class="section-kicker">Estado de carrocería</div><h2>Daños conocidos por vehículo</h2><div class="history-note" style="margin-top:9px">ℹ Los reparados se conservan aquí como histórico, pero no aparecen a los chóferes.</div></div><button class="btn dark" onclick="newDamageForm()">+ Añadir daño</button></div></div><div class="damage-section-title"><h3>⚠ Activos</h3><span class="count-pill">${active.length}</span></div><div class="damage-grid">${active.map(damageCard).join('')||'<div class="card empty">No hay daños activos registrados.</div>'}</div><div class="damage-section-title" style="margin-top:24px"><h3>✓ Reparados · Histórico</h3><span class="count-pill">${repaired.length}</span></div><div class="damage-grid">${repaired.map(damageCard).join('')||'<div class="card empty">No hay daños reparados.</div>'}</div>`}
function damageCard(d){return `<div class="damage-card ${d.status==='active'?'activeDamage':'repaired'}"><img loading="lazy" src="${d.photoSrc}"><div class="pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="plate">${esc(d.plate)}</div>${d.status==='active'?'<span class="badge review">ACTIVO</span>':'<span class="badge reviewed">REPARADO</span>'}</div><b style="display:block;margin-top:8px">${esc(d.zone)}</b><p>${esc(d.description)}</p><div class="muted">Registrado ${dt(d.created_at)}</div>${d.status==='active'?`<button class="btn light" style="margin-top:11px;width:100%" onclick="repairDamage('${d.id}')">✓ Marcar como reparado</button>`:`<div class="muted" style="margin-top:9px">Reparado ${d.repaired_at?dt(d.repaired_at):''}</div>`}</div></div>`}
function newDamageForm(){document.getElementById('content').innerHTML=`<button class="btn light" onclick="damages()">← Volver a daños</button><div class="card form-card" style="margin-top:12px"><div class="section-kicker">Nuevo registro</div><h2>Registrar daño conocido</h2><p class="muted">Este daño aparecerá en Alegre Check de los chóferes hasta que lo marques como reparado.</p><label>Matrícula</label><select id="dPlate"><option value="">Selecciona</option>${PLATES.map(p=>`<option>${p}</option>`).join('')}</select><label>Zona</label><select id="dZone"><option value="">Selecciona</option>${['Frontal','Trasera','Lateral izquierdo','Lateral derecho','Paragolpes','Puerta','Aleta','Capó','Techo','Otro'].map(z=>`<option>${z}</option>`).join('')}</select><label>Descripción</label><textarea id="dDesc" placeholder="Ej. Rozadura en paragolpes trasero derecho"></textarea><label>Fotografía del daño</label><input id="dPhoto" type="file" accept="image/*"><button class="btn dark" style="margin-top:13px;width:100%" onclick="saveDamage()">Guardar daño conocido</button></div>`}
function fileToDataUrl(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}async function saveDamage(){const plate=document.getElementById('dPlate').value,zone=document.getElementById('dZone').value,description=document.getElementById('dDesc').value.trim(),file=document.getElementById('dPhoto').files[0];if(!plate||!zone||!description||!file)return alert('Completa matrícula, zona, descripción y fotografía.');const dataUrl=await fileToDataUrl(file);let r=await fetch('/api/office-damage-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataUrl,plate})});let j=await r.json();if(!r.ok)return alert(j.error||'No se pudo subir la foto');r=await fetch('/api/vehicle-damages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',plate,zone,description,photoUrl:j.url,reviewer:'Oficina'})});if(!r.ok)return alert('No se pudo guardar el daño');await load();tab='damages';render()}
async function repairDamage(id){const notes=prompt('Comentario de reparación (opcional):')||'';const r=await fetch('/api/vehicle-damages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'repair',id,notes,reviewer:'Oficina'})});if(!r.ok)return alert('No se pudo actualizar el daño');await load();tab='damages';render()}
boot();
</script></body></html>
