<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alegre Check · Oficina</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;background:#f3f4f6;color:#111827}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0}.muted{color:#6b7280}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#111827;color:white;padding:16px;border-radius:14px}.stat b{font-size:28px;display:block}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.dark{background:#111827;color:#fff}.light{background:#e5e7eb}.green{background:#dcfce7}.amber{background:#fef3c7}.red{background:#fee2e2}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:13px;cursor:pointer}.plate{font-size:20px;font-weight:800}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#e5e7eb}.review{background:#fef3c7}.auto{background:#dcfce7}.reviewed{background:#dbeafe}.pending{background:#e5e7eb}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photo{background:#f9fafb;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb}.photo img{width:100%;height:210px;object-fit:cover;display:block}.photo div{padding:8px;font-size:12px;font-weight:700}.score-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.score{padding:16px;font-size:18px}.login{max-width:420px;margin:70px auto}.login input,textarea,select,input[type=file]{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{padding:10px;border:1px solid #d1d5db;border-radius:10px}.empty{text-align:center;color:#6b7280;padding:30px}.damage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.damage-card{border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;background:#fff}.damage-card img{width:100%;height:210px;object-fit:cover}.damage-card .pad{padding:12px}.activeDamage{border:2px solid #f59e0b}.repaired{opacity:.65}@media(max-width:760px){.stats,.photos,.score-buttons,.damage-grid{grid-template-columns:1fr}.row{grid-template-columns:100px 1fr}.row>div:last-child{grid-column:1/-1}.wrap{padding:12px}}</style></head><body><main class="wrap"><div id="app"></div></main><script>
const PLATES=['KCV','49 NGM','25 NGM','KVF','MFB','MJB','MPT','90 NGM','KZZ','LBG','LBZ','LYR','LZD','KYS','MVJ','MVG','MTY','KXW','MGC'];const LABELS={front:'Frontal',rear:'Trasera',left:'Lateral izquierdo',right:'Lateral derecho',cabFront:'Interior delantero',cabRear:'Interior trasero',matsFront:'Alfombras delanteras',matsRear:'Alfombras traseras',dashboard:'Cuadro / combustible',interior:'Limpieza interior',exterior:'Limpieza exterior',mechanics:'Mecánica',bodywork:'Plancha'};let DATA=null,DAMAGES=[],tab='reviews',search='';const app=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dt(x){return new Date(x).toLocaleString('es-ES',{timeZone:'Europe/Madrid',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function status(r){if(r.score_status==='review')return'<span class="badge review">Revisión oficina</span>';if(r.score_status==='auto')return'<span class="badge auto">10 automático</span>';if(r.score_status==='reviewed')return`<span class="badge reviewed">Resuelto · ${r.score} puntos</span>`;return'<span class="badge pending">Pendiente de recogida</span>'}
async function boot(){const q=await fetch('/api/office-login');const a=await q.json();if(!a.configured)return app.innerHTML='<div class="card login"><h2>Panel de Oficina</h2><p>Falta configurar el PIN privado de oficina en Vercel.</p></div>';if(!a.authorized)return login();await load()}function login(msg=''){app.innerHTML=`<div class="card login"><h1>Alegre Check</h1><h2>Panel de Oficina</h2><p class="muted">Acceso privado</p>${msg?`<p style="color:#b91c1c">${esc(msg)}</p>`:''}<input id="pin" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" enterkeyhint="go" placeholder="Contraseña de oficina" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn dark" style="width:100%;margin-top:10px" onclick="doLogin()">Entrar</button></div>`}async function doLogin(){const r=await fetch('/api/office-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});if(!r.ok)return login('Contraseña incorrecta');await load()}
async function load(){const [r,d]=await Promise.all([fetch('/api/office-data'),fetch('/api/vehicle-damages')]);if(r.status===401||d.status===401)return login();DATA=await r.json();DAMAGES=(await d.json()).damages||[];render()}
function render(){const pending=DATA.reviews.length,evaluated=DATA.ranking.reduce((a,x)=>a+(x.evaluated_dropoffs||0),0),leader=DATA.ranking.find(x=>x.average!=null);app.innerHTML=`<div class="top"><div><h1>Panel de Oficina</h1><div class="muted">Alegre Check · ${esc(DATA.month)}</div></div><a class="btn light" href="/">Ir al formulario</a></div><div class="stats"><div class="stat"><span>Revisiones pendientes</span><b>${pending}</b></div><div class="stat"><span>Dejadas evaluadas</span><b>${evaluated}</b></div><div class="stat"><span>Líder del mes</span><b style="font-size:20px">${leader?esc(leader.driver):'—'}</b><span>${leader?.average??'—'} / 10</span></div></div><div class="tabs"><button class="btn ${tab==='reviews'?'dark':'light'}" onclick="tab='reviews';render()">⚠ Revisiones (${pending})</button><button class="btn ${tab==='dropoffs'?'dark':'light'}" onclick="tab='dropoffs';render()">📷 Todas las dejadas</button><button class="btn ${tab==='damages'?'dark':'light'}" onclick="tab='damages';render()">🚘 Daños conocidos</button><button class="btn ${tab==='ranking'?'dark':'light'}" onclick="tab='ranking';render()">🏆 Ranking</button></div><div id="content"></div>`;if(tab==='reviews')reviews();if(tab==='dropoffs')dropoffs();if(tab==='damages')damages();if(tab==='ranking')ranking()}
function row(r){return `<div class="row" onclick="openCase('${r.id}')"><div class="plate">${esc(r.plate)}</div><div><b>${esc(r.driver)}</b><div class="muted">Dejada · ${dt(r.created_at)}</div>${r.pickup_driver?`<div>→ Recoge <b>${esc(r.pickup_driver)}</b> · ${dt(r.pickup_created_at)}</div>`:'<div class="muted">Aún sin recogida posterior</div>'}</div><div>${status(r)}</div></div>`}function reviews(){const el=document.getElementById('content');el.innerHTML=DATA.reviews.length?'<div class="list">'+DATA.reviews.map(row).join('')+'</div>':'<div class="card empty">No hay revisiones pendientes.</div>'}function dropoffs(){const el=document.getElementById('content'),q=search.trim().toLowerCase(),rows=DATA.dropoffs.filter(r=>!q||r.plate.toLowerCase().includes(q)||r.driver.toLowerCase().includes(q));el.innerHTML=`<div class="card toolbar"><b>Histórico completo de dejadas</b><input placeholder="Buscar matrícula o conductor" value="${esc(search)}" oninput="search=this.value;dropoffs()"><span class="muted">${rows.length} registros</span></div><div class="list">${rows.map(row).join('')||'<div class="card empty">Sin resultados.</div>'}</div>`}
function photos(title,arr){return `<h3>${esc(title)}</h3>${arr.length?`<div class="photos">${arr.map(p=>`<div class="photo"><img loading="lazy" src="${p.src}"><div>${esc(LABELS[p.label]||p.label)}</div></div>`).join('')}</div>`:'<p class="muted">Sin fotografías.</p>'}`}function reasonText(r){return Array.isArray(r.pickup_reasons)&&r.pickup_reasons.length?r.pickup_reasons.join(', '):(r.pickup_apt===true?'Apto para trabajar':'—')}
function openCase(id){const r=DATA.dropoffs.find(x=>x.id===id)||DATA.reviews.find(x=>x.id===id);if(!r)return;document.getElementById('content').innerHTML=`<button class="btn light" onclick="render()">← Volver</button><div class="card"><div class="top"><div><div class="plate">${esc(r.plate)}</div><b>${esc(r.driver)}</b> · Dejada ${dt(r.created_at)}</div>${status(r)}</div>${photos('9 fotos de la dejada',r.dropoffPhotos)}<h3>Checklist declarado</h3><pre>${esc(JSON.stringify(r.checklist,null,2))}</pre></div>${r.pickup_id?`<div class="card"><h2>Siguiente recogida</h2><p><b>${esc(r.pickup_driver)}</b> · ${dt(r.pickup_created_at)}</p><p><b>Resultado:</b> ${esc(reasonText(r))}</p>${photos('Fotos de incidencias en la recogida',r.pickupPhotos)}</div>`:''}${r.score_status==='review'?`<div class="card"><h2>Decisión de oficina</h2><p>Compara las evidencias y asigna los puntos al conductor que dejó el vehículo.</p><textarea id="reviewNotes" placeholder="Comentario opcional"></textarea><div class="score-buttons"><button class="btn green score" onclick="resolveReview('${r.id}',10)">10 · Correcto</button><button class="btn amber score" onclick="resolveReview('${r.id}',5)">5 · Mejorable</button><button class="btn red score" onclick="resolveReview('${r.id}',0)">0 · Incorrecto</button></div></div>`:''}`}
async function resolveReview(id,score){if(!confirm(`Asignar ${score} puntos a esta dejada?`))return;const r=await fetch('/api/office-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dropoffId:id,score,notes:document.getElementById('reviewNotes')?.value||'',reviewer:'Oficina'})});if(!r.ok)return alert('No se pudo guardar la revisión');await load()}
function ranking(){const el=document.getElementById('content');el.innerHTML=`<div class="card"><h2>Ranking mensual de conductores</h2><table class="rank"><thead><tr><th>#</th><th>Conductor</th><th>Media</th><th>Evaluadas</th><th>10</th><th>5</th><th>0</th><th>Pendientes</th></tr></thead><tbody>${DATA.ranking.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.driver)}</b></td><td>${r.average??'—'}</td><td>${r.evaluated_dropoffs}</td><td>${r.tens}</td><td>${r.fives}</td><td>${r.zeros}</td><td>${r.pending_reviews}</td></tr>`).join('')}</tbody></table></div>`}
function damages(){const active=DAMAGES.filter(d=>d.status==='active'),repaired=DAMAGES.filter(d=>d.status==='repaired');document.getElementById('content').innerHTML=`<div class="card"><div class="top"><div><h2 style="margin:0">Daños conocidos por vehículo</h2><div class="muted">Se conservan también los daños reparados para mantener el historial.</div></div><button class="btn dark" onclick="newDamageForm()">+ Añadir daño</button></div></div><h3>Activos (${active.length})</h3><div class="damage-grid">${active.map(damageCard).join('')||'<div class="card empty">No hay daños activos registrados.</div>'}</div><h3>Reparados (${repaired.length})</h3><div class="damage-grid">${repaired.map(damageCard).join('')||'<div class="card empty">No hay daños reparados.</div>'}</div>`}
function damageCard(d){return `<div class="damage-card ${d.status==='active'?'activeDamage':'repaired'}"><img loading="lazy" src="${d.photoSrc}"><div class="pad"><div class="plate">${esc(d.plate)}</div><b>${esc(d.zone)}</b><p>${esc(d.description)}</p><div class="muted">Registrado ${dt(d.created_at)}</div>${d.status==='active'?`<button class="btn light" style="margin-top:10px" onclick="repairDamage('${d.id}')">Marcar como reparado</button>`:`<div class="badge reviewed" style="margin-top:10px">Reparado ${d.repaired_at?dt(d.repaired_at):''}</div>`}</div></div>`}
function newDamageForm(){document.getElementById('content').innerHTML=`<button class="btn light" onclick="damages()">← Volver</button><div class="card"><h2>Registrar daño conocido</h2><label>Matrícula</label><select id="dPlate"><option value="">Selecciona</option>${PLATES.map(p=>`<option>${p}</option>`).join('')}</select><label>Zona</label><select id="dZone"><option value="">Selecciona</option>${['Frontal','Trasera','Lateral izquierdo','Lateral derecho','Paragolpes','Puerta','Aleta','Capó','Techo','Otro'].map(z=>`<option>${z}</option>`).join('')}</select><label>Descripción</label><textarea id="dDesc" placeholder="Ej. Rozadura en paragolpes trasero derecho"></textarea><label>Fotografía del daño</label><input id="dPhoto" type="file" accept="image/*"><button class="btn dark" style="margin-top:12px" onclick="saveDamage()">Guardar daño conocido</button></div>`}
function fileToDataUrl(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}async function saveDamage(){const plate=document.getElementById('dPlate').value,zone=document.getElementById('dZone').value,description=document.getElementById('dDesc').value.trim(),file=document.getElementById('dPhoto').files[0];if(!plate||!zone||!description||!file)return alert('Completa matrícula, zona, descripción y fotografía.');const dataUrl=await fileToDataUrl(file);let r=await fetch('/api/office-damage-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataUrl,plate})});let j=await r.json();if(!r.ok)return alert(j.error||'No se pudo subir la foto');r=await fetch('/api/vehicle-damages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',plate,zone,description,photoUrl:j.url,reviewer:'Oficina'})});if(!r.ok)return alert('No se pudo guardar el daño');await load();tab='damages';render()}
async function repairDamage(id){const notes=prompt('Comentario de reparación (opcional):')||'';const r=await fetch('/api/vehicle-damages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'repair',id,notes,reviewer:'Oficina'})});if(!r.ok)return alert('No se pudo actualizar el daño');await load();tab='damages';render()}
boot();</script></body></html>
