<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Alegre Check</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;background:#f5f7fa;color:#111827}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:#111827;color:#fff;padding:22px;border-radius:18px;margin-bottom:14px}.card{background:#fff;padding:18px;border-radius:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:16px}.primary{background:#111827;color:#fff}.alt{background:#e5e7eb}.choice{background:#fff;border:1px solid #d1d5db}.active{outline:3px solid #111827}.label{display:block;font-weight:700;margin:12px 0 6px}select,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:16px}textarea{min-height:90px}.bad{background:#fff1f2;border:1px solid #fecdd3;padding:12px;border-radius:12px;margin-top:12px}.subbox{background:#f9fafb;border:1px solid #e5e7eb;padding:12px;border-radius:12px;margin-top:12px}.stack{display:grid;gap:10px}.small{font-size:13px;color:#6b7280}.known{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:12px;margin-top:10px}.cam{background:#000;border-radius:14px;overflow:hidden;margin:8px 0}.cam video,.cam img{width:100%;display:block}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.photo{position:relative}.photo img{width:100%;height:140px;object-fit:cover;border-radius:10px}.photo button{position:absolute;right:6px;top:6px;width:auto;padding:6px 9px;border:0;border-radius:999px;background:#111827;color:#fff}.evidence{padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:10px 0}.done{background:#f0fdf4;border-color:#bbf7d0}.counter{font-size:13px;color:#4b5563;margin:6px 0}.saving{text-align:center;padding:28px}.saving:after{content:'•••';display:block;font-size:28px;letter-spacing:8px;margin-top:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="hero"><h1>Alegre Check</h1><p>Control de flota · Autos Alegre</p></div>
    <div id="app"></div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
