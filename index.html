<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alegre Check</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;background:#f5f7fa;color:#111827}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:#111827;color:white;padding:22px;border-radius:18px;margin-bottom:14px}.card{background:white;padding:18px;border-radius:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:16px}.primary{background:#111827;color:white}.alt{background:#e5e7eb}.choice{background:white;border:1px solid #d1d5db}.active{outline:3px solid #111827}.label{display:block;font-weight:700;margin:12px 0 6px}select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:white;font-size:16px}.bad{background:#fff1f2;border:1px solid #fecdd3;padding:12px;border-radius:12px;margin-top:12px}.cam{background:#000;border-radius:14px;overflow:hidden;margin:8px 0}.cam video,.cam img{width:100%;display:block}.stack{display:grid;gap:10px}.small{font-size:13px;color:#6b7280}.hidden{display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="hero"><h1>Alegre Check</h1><p>Control de flota · Autos Alegre</p></div><div id="app"></div></main><script>
const DRIVERS=['Juan F.','Andrei K','Marc A','Carlos E','Carles A','Jordi N','Zoltan D','David A','Fadoua C','Armando S','Xavi V','Vasyl L','Ivan R','ROstik K','Cristian G','Bogdan H','Angel V','Paolo V','Jordi Y','Albert R','Mika J','Lalo M','Ihor G','Eduardo R','Imad A','Daniel E'];
const PLATES=['KCV','49 NGM','25 NGM','KVF','MFB','MJB','MPT','90 NGM','KZZ','LBG','LBZ','LYR','LZD','KYS','MVJ','MVG','MTY','KXW','MGC'];
let s={mode:'',driver:'',plate:'',apt:null,reasons:[],drop:{exterior:null,interior:null,fuel:null,breakdowns:null,bodywork:null},photos:{exterior:'',interior:''}};
const app=document.getElementById('app');
function opts(arr,val){return '<option value="">Selecciona</option>'+arr.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}
function render(){if(!s.mode){app.innerHTML=`<div class="card"><h2>¿Qué vas a hacer?</h2><div class="grid"><button class="btn primary" onclick="setMode('pickup')">Recojo el vehículo</button><button class="btn alt" onclick="setMode('dropoff')">Dejo el vehículo</button></div></div>`;return}
let h=`<div class="card"><h2>${s.mode==='pickup'?'Recogida de vehículo':'Dejada de vehículo'}</h2><label class="label">Conductor</label><select onchange="s.driver=this.value">${opts(DRIVERS,s.driver)}</select><label class="label">Matrícula</label><select onchange="s.plate=this.value">${opts(PLATES,s.plate)}</select></div>`;
if(s.mode==='pickup'){h+=`<div class="card"><h2>¿El vehículo está apto para trabajar?</h2><div class="grid"><button class="btn choice ${s.apt===true?'active':''}" onclick="s.apt=true;render()">Sí, está apto</button><button class="btn choice ${s.apt===false?'active':''}" onclick="s.apt=false;render()">No está apto</button></div>${s.apt===false?`<div class="bad"><strong>¿Por qué no está apto?</strong><div class="stack" style="margin-top:10px">${['Limpieza interior','Limpieza exterior','Mecánica','Plancha'].map(r=>`<button class="btn choice ${s.reasons.includes(r)?'active':''}" onclick="toggleReason('${r}')">${r}</button>`).join('')}</div></div>`:''}</div>`}
else{h+=`<div class="card"><h2>Checklist de dejada</h2><p class="small">Confirma los cinco puntos. Las fotos de limpieza se hacen ahora con la cámara.</p>${[['exterior','Limpieza exterior correcta'],['interior','Limpieza interior correcta'],['fuel','Repostado correcto'],['breakdowns','Sin averías'],['bodywork','Sin incidencias de plancha']].map(([k,l])=>`<div style="margin-bottom:14px"><span class="label">${l}</span><div class="grid"><button class="btn choice ${s.drop[k]===true?'active':''}" onclick="setDrop('${k}',true)">Sí</button><button class="btn choice ${s.drop[k]===false?'active':''}" onclick="setDrop('${k}',false)">No</button></div></div>`).join('')}<div id="cam-ext"></div><div id="cam-int"></div></div>`}
h+=`<button class="btn primary" onclick="finish()">Finalizar y guardar</button><button class="btn alt" style="margin-top:10px" onclick="resetAll()">Cancelar</button>`;app.innerHTML=h;if(s.mode==='dropoff'){cameraBlock('cam-ext','exterior','Foto obligatoria · Limpieza exterior');cameraBlock('cam-int','interior','Foto obligatoria · Limpieza interior')}}
function setMode(m){s.mode=m;render()} function setDrop(k,v){s.drop[k]=v;render()} function toggleReason(r){s.reasons=s.reasons.includes(r)?s.reasons.filter(x=>x!==r):[...s.reasons,r];render()}
function cameraBlock(id,key,label){const el=document.getElementById(id);el.innerHTML=`<span class="label">${label}</span>${s.photos[key]?`<div class="cam"><img src="${s.photos[key]}"></div>`:''}<button class="btn alt" onclick="startCamera('${id}','${key}')">${s.photos[key]?'Repetir foto':'Abrir cámara y hacer foto'}</button>`}
async function startCamera(id,key){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const el=document.getElementById(id);el.innerHTML=`<span class="label">${key==='exterior'?'Foto obligatoria · Limpieza exterior':'Foto obligatoria · Limpieza interior'}</span><div class="cam"><video id="v-${key}" autoplay playsinline muted></video></div><button class="btn primary" id="shot-${key}">Hacer foto ahora</button><button class="btn alt" style="margin-top:8px" id="cancel-${key}">Cancelar</button>`;const v=document.getElementById('v-'+key);v.srcObject=stream;document.getElementById('shot-'+key).onclick=()=>{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);s.photos[key]=c.toDataURL('image/jpeg',.82);stream.getTracks().forEach(t=>t.stop());render()};document.getElementById('cancel-'+key).onclick=()=>{stream.getTracks().forEach(t=>t.stop());render()}}catch(e){alert('No se ha podido abrir la cámara. Revisa el permiso de Cámara en Safari.')}}
function finish(){if(!s.driver||!s.plate)return alert('Selecciona conductor y matrícula.');if(s.mode==='pickup'){if(s.apt===null)return alert('Indica si está apto.');if(s.apt===false&&!s.reasons.length)return alert('Selecciona al menos un motivo.')}else{if(Object.values(s.drop).some(v=>v===null))return alert('Completa los cinco puntos.');if(!s.photos.exterior||!s.photos.interior)return alert('Las dos fotos de limpieza son obligatorias y deben hacerse con la cámara.')}const rec={...s,date:new Date().toISOString()};const list=JSON.parse(localStorage.getItem('alegre-check-records')||'[]');list.unshift(rec);localStorage.setItem('alegre-check-records',JSON.stringify(list.slice(0,100)));app.innerHTML=`<div class="card"><h2>Registro guardado</h2><p>${s.mode==='pickup'?'Recogida':'Dejada'} de ${s.plate} registrada para ${s.driver}.</p><button class="btn primary" onclick="resetAll()">Nueva inspección</button></div>`}
function resetAll(){s={mode:'',driver:'',plate:'',apt:null,reasons:[],drop:{exterior:null,interior:null,fuel:null,breakdowns:null,bodywork:null},photos:{exterior:'',interior:''}};render()}render();
</script></body></html>
