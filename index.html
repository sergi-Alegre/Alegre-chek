<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d2b">
  <title>Alegre Check</title>
  <style>
    :root{--petrol:#071d2b;--petrol2:#0b2d40;--panel:#0e3448;--pink:#ef4f87;--pink2:#ff78a8;--cyan:#30c7e8;--green:#39dc8b;--gold:#ffc857;--white:#f7fbff;--muted:#a9c0cf;--danger:#ff617c}
    *{box-sizing:border-box}html{min-height:100%;background:var(--petrol)}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--white);background:radial-gradient(circle at 50% -10%,#0e5570 0,#092d40 28%,#071d2b 62%,#04131d 100%);background-attachment:fixed}.wrap{width:min(100%,760px);min-height:100dvh;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(18,65,87,.96),rgba(6,29,43,.98));border:1px solid rgba(83,197,230,.22);box-shadow:0 18px 45px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.06);padding:17px 18px;border-radius:24px;margin-bottom:14px}.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(239,79,135,.16);filter:blur(15px);right:-70px;top:-95px}.brand{display:flex;align-items:center;gap:13px;position:relative;z-index:1}.brandmark{width:118px;height:78px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.brandmark img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.28))}.brandtext{min-width:0;flex:1}.brandtext h1{margin:0;font-size:27px;line-height:1;letter-spacing:-.6px}.brandtext h1 span{color:var(--pink2)}.brandtext p{margin:6px 0 0;color:#d8e8ef;font-size:13px}.gamebar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;position:relative;z-index:1}.gamechip{background:rgba(3,20,30,.55);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 5px;text-align:center;font-size:10px;color:var(--muted)}.gamechip strong{display:block;color:#fff;font-size:11px;margin-top:3px}#app{flex:1}.card{background:linear-gradient(145deg,rgba(15,52,72,.96),rgba(8,36,52,.98));border:1px solid rgba(69,183,218,.2);box-shadow:0 14px 34px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.04);padding:18px;border-radius:22px;margin-bottom:14px}.card h2{font-size:20px;margin:0 0 15px}.card h3{margin:0 0 10px}.mission-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.mission-title>strong{font-size:19px;color:var(--pink2);background:rgba(239,79,135,.1);padding:7px 9px;border-radius:11px}.mission-tag{font-size:10px;font-weight:900;letter-spacing:1.1px;color:var(--pink2);text-transform:uppercase}.progress{height:7px;background:#123e52;border-radius:999px;overflow:hidden;margin:8px 0 18px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2));border-radius:inherit;box-shadow:0 0 14px rgba(239,79,135,.65);transition:width .35s ease}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{appearance:none;width:100%;padding:15px 13px;border:0;border-radius:14px;font-weight:800;font-size:15px;color:#fff;cursor:pointer;transition:transform .12s ease,filter .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.975)}.primary{background:linear-gradient(135deg,var(--pink),#d93773);box-shadow:0 8px 22px rgba(239,79,135,.28)}.alt{background:#173f53;color:#d8e7ee;border:1px solid rgba(255,255,255,.08)}.choice{background:#0b2d40;border:1px solid #28556a;color:#eaf7fb;box-shadow:none}.choice.active,.active{border-color:var(--pink2)!important;box-shadow:0 0 0 2px rgba(239,79,135,.42),0 0 20px rgba(239,79,135,.16)!important;background:linear-gradient(145deg,#123e52,#0c3043)}.mission-buttons{margin-top:14px}.mission-buttons .btn{min-height:120px;text-align:left;position:relative;overflow:hidden;padding:18px}.mission-buttons .btn b{display:block;font-size:19px;margin-bottom:5px}.mission-buttons .btn small{display:block;font-weight:500;opacity:.8;max-width:170px}.mission-buttons .pickup{background:linear-gradient(135deg,#0a668d,#0d3b5a);border:1px solid #33bde1}.mission-buttons .dropoff{background:linear-gradient(135deg,#eb4b84,#a92861);border:1px solid #ff88b3}.mission-icon{font-size:35px;display:block;margin-bottom:10px}.label{display:block;font-weight:800;margin:13px 0 6px;color:#e9f7fb;font-size:14px}select,textarea{width:100%;padding:14px;border:1px solid #28556a;border-radius:13px;background:#08283a;color:#fff;font-size:16px;outline:none}select:focus,textarea:focus{border-color:var(--pink2);box-shadow:0 0 0 3px rgba(239,79,135,.16)}textarea{min-height:90px}.bad{background:linear-gradient(145deg,rgba(90,25,47,.65),rgba(45,24,38,.65));border:1px solid rgba(255,97,124,.45);padding:13px;border-radius:15px;margin-top:12px}.subbox{background:rgba(3,24,36,.7);border:1px solid rgba(111,191,218,.18);padding:13px;border-radius:15px;margin-top:12px}.stack{display:grid;gap:9px;margin-top:10px}.small{font-size:13px;color:var(--muted)}.known{background:rgba(28,80,105,.45);border:1px solid rgba(48,199,232,.27);padding:12px;border-radius:12px;margin-top:10px}.cam{background:#000;border-radius:14px;overflow:hidden;margin:8px 0;border:1px solid #315a6d}.cam video,.cam img{width:100%;display:block}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.photo{position:relative}.photo img{width:100%;height:140px;object-fit:cover;border-radius:10px;border:1px solid #315a6d}.photo button{position:absolute;right:6px;top:6px;width:auto;padding:6px 9px;border:0;border-radius:999px;background:#071d2b;color:#fff}.evidence{padding:13px;border:1px solid #28556a;border-radius:15px;margin:10px 0;background:rgba(4,27,40,.55)}.done{border-color:rgba(57,220,139,.5);background:rgba(26,100,72,.22);box-shadow:inset 0 0 18px rgba(57,220,139,.06)}.done strong:after{content:" ✓";color:var(--green)}.counter{font-size:13px;color:var(--muted);margin:6px 0}.saving{text-align:center;padding:30px}.saving:after{content:'•••';display:block;font-size:28px;letter-spacing:8px;margin-top:10px;color:var(--pink2);animation:pulse 1s infinite}.status-banner{border-radius:18px;padding:18px;text-align:center;margin:12px 0;border:1px solid}.status-banner .emoji{font-size:54px;display:block;animation:pop .36s ease}.status-banner.good{background:rgba(26,112,79,.22);border-color:rgba(57,220,139,.45)}.status-banner.good h3{color:#66f3aa}.status-banner.bad-news{background:rgba(103,30,54,.25);border-color:rgba(255,97,124,.42)}.status-banner.bad-news h3{color:#ff7890}.reward{background:linear-gradient(145deg,rgba(79,61,13,.38),rgba(26,61,66,.28));border:1px solid rgba(255,200,87,.42);padding:15px;border-radius:16px;text-align:center}.reward .trophy{font-size:64px;filter:drop-shadow(0 6px 13px rgba(255,200,87,.25));animation:bounce .8s ease}.reward strong{display:block;color:var(--gold);font-size:20px;margin-top:5px}.overlay{position:fixed;z-index:99;inset:0;display:grid;place-items:center;padding:22px;background:rgba(1,13,20,.76);backdrop-filter:blur(7px);animation:fade .18s ease}.overlay-card{max-width:340px;width:100%;background:linear-gradient(145deg,#0d3d53,#071e2c);border:1px solid rgba(255,255,255,.13);border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 25px 70px #000}.overlay-icon{font-size:78px;display:block;animation:pop .42s ease}.overlay-card h2{font-size:27px;margin:10px 0 7px}.overlay-card p{color:#c6d9e3;margin:0}.overlay-card.good h2{color:#6bf1ae}.overlay-card.sad h2{color:#ff7895}.confetti{position:fixed;z-index:100;top:-20px;width:9px;height:15px;border-radius:3px;animation:fall 1.55s linear forwards;pointer-events:none}.microcopy{text-align:center;color:#8fb1c1;font-size:11px;margin-top:4px}.section-kicker{font-size:11px;color:var(--cyan);font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}.check-row{margin-bottom:14px;padding:12px;background:rgba(5,27,39,.46);border-radius:14px;border:1px solid rgba(255,255,255,.05)}
    @keyframes pop{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}@keyframes pulse{50%{opacity:.35}}@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fall{to{transform:translateY(110vh) rotate(650deg);opacity:.9}}
    @media(max-width:560px){
      .grid:not(.mission-buttons){grid-template-columns:1fr}
      .wrap{padding-left:10px;padding-right:10px;padding-bottom:10px}
      .hero{border-radius:20px;padding:13px 14px;margin-bottom:10px}
      .brandmark{width:90px;height:62px}.brandtext h1{font-size:22px}.brandtext p{font-size:11px}
      .gamebar{margin-top:10px}.gamechip{padding:6px 3px;font-size:9px}.gamechip strong{font-size:10px}
      #app>.card:only-child{min-height:calc(100dvh - 196px);display:flex;flex-direction:column;margin-bottom:6px;padding:14px;border-radius:19px}
      #app>.card:only-child>.small{margin:0 0 8px}
      .mission-buttons{grid-template-columns:1fr;grid-template-rows:1fr 1fr;flex:1;gap:12px;margin-top:8px}
      .mission-buttons .btn{min-height:0;height:100%;padding:18px 20px;border-radius:20px;display:flex;flex-direction:column;justify-content:center}
      .mission-buttons .btn b{font-size:24px;line-height:1.03;margin-bottom:8px}.mission-buttons .btn small{font-size:13px;max-width:none}.mission-icon{font-size:44px;margin-bottom:8px}
      .card{padding:16px;border-radius:19px;margin-bottom:10px}.card h2{font-size:22px;line-height:1.12}.label{font-size:15px;margin-top:15px}select,textarea{min-height:54px;font-size:17px}.btn{min-height:54px;font-size:16px}.choice{padding:16px}.progress{height:10px;margin-bottom:15px}.mission-title{margin-bottom:8px}.mission-title>strong{font-size:18px}.status-banner{padding:20px 14px}.status-banner .emoji{font-size:62px}.status-banner h3{font-size:21px;margin:7px 0}.bad{padding:14px}.stack{gap:10px}.subbox{padding:14px}.evidence{padding:15px;margin:12px 0}.evidence>strong{font-size:17px}.primary{min-height:62px;font-size:18px;position:sticky;bottom:8px;z-index:10;box-shadow:0 10px 28px rgba(239,79,135,.42)}.microcopy{margin-top:2px;font-size:9px}
    }
  </style>
</head>
